name: Build and sign release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      media_run:
        type: string
        default: ""
        description: Reuse an immutable media runtime artifact with unchanged media build sources
      candidate_run:
        type: string
        default: ""
        description: Revalidate unchanged packages from a previous compiled candidate
      rebuild_media:
        type: boolean
        default: true
        description: Rebuild the pinned LGPL tools instead of reusing the verified released runtime
      sign:
        type: boolean
        default: false
        description: Submit to the configured SignPath policy
      publish:
        type: boolean
        default: false
        description: Create a draft GitHub release
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.media_run || 'fresh' }}
  cancel-in-progress: false
jobs:
  media:
    if: ${{ !inputs.media_run && !inputs.candidate_run && (inputs.rebuild_media || github.ref_type == 'tag') }}
    uses: ./.github/workflows/windows-media.yml
  build:
    needs: media
    if: ${{ always() && !cancelled() && (needs.media.result == 'success' || needs.media.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
    env:
      FLUX_REQUIRE_MEDIA_TESTS: "1"
      RUST_MIN_STACK: "8388608"
      SIGN_REQUESTED: ${{ inputs.sign || vars.SIGNPATH_ENABLED == 'true' }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      FLUX_SIGNING_THUMBPRINT: ${{ vars.FLUX_SIGNING_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-pkgconf make diffutils
      - name: Validate version and signing configuration
        id: plan
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is required for signed application updates.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package version.' }
          if ($env:SIGN_REQUESTED -eq 'true') {
            foreach ($name in 'SIGNPATH_API_TOKEN','SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG') {
              if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Required signing configuration is missing: $name" }
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - name: Frontend checks and production audit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          npm test *> .tools/frontend-tests.log
          Get-Content .tools/frontend-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          npm audit --omit=dev --json > .tools/production-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Production dependency audit failed.' }
          npx --yes web-ext@10.7.0 lint --source-dir extension-firefox-modern --output json > .tools/firefox-lint-modern.json
          if ($LASTEXITCODE -ne 0) { throw 'Firefox extension validation failed.' }
          ./scripts/package-browser-stores.ps1
          ./scripts/verify-browser-stores.ps1
      - name: Prepare pinned fixture encoder
        shell: pwsh
        run: ./scripts/prepare-test-runtime.ps1
      - name: Verify released LGPL media runtime
        if: ${{ !inputs.rebuild_media && github.ref_type != 'tag' && !inputs.candidate_run && !inputs.media_run }}
        shell: pwsh
        run: ./scripts/prepare-released-media.ps1
      - name: Download compiled candidates
        if: inputs.candidate_run != ''
        uses: actions/download-artifact@v4
        with:
          name: candidate-windows-x64
          path: release
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reusable pinned media artifact
        if: inputs.media_run != '' || needs.media.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $mediaRun = '${{ inputs.media_run }}'
          if (-not $mediaRun) { $mediaRun = $env:GITHUB_RUN_ID }
          ./scripts/reuse-media-runtime.ps1 -RunId $mediaRun
      - name: Prepare Windows packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ('${{ inputs.candidate_run }}' -ne '') {
            ./scripts/restore-release-candidate.ps1 -RunId '${{ inputs.candidate_run }}'
          } elseif ('${{ inputs.media_run }}' -ne '' -or '${{ needs.media.result }}' -eq 'success') {
            ./scripts/build-release.ps1 -RuntimePackage (Get-Content .tools/reused-media-path.txt -Raw)
          } else {
            ./scripts/build-release.ps1 -RuntimePackage (Get-Content .tools/released-media-path.txt -Raw)
          }
          if ('${{ inputs.candidate_run }}' -eq '') {
            @{build_run=$env:GITHUB_RUN_ID;source_commit=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content release/candidate-provenance.json -Encoding utf8
            "FLUX_BINARY_BUILD_RUN=$env:GITHUB_RUN_ID" >> $env:GITHUB_ENV
            "FLUX_BINARY_SOURCE_COMMIT=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          }
          $runtime = Join-Path $PWD 'target/release'
          $env:FLUX_FFMPEG = Join-Path $runtime 'ffmpeg.exe'
          $env:FLUX_FFPROBE = Join-Path $runtime 'ffprobe.exe'
          "FLUX_FFMPEG=$env:FLUX_FFMPEG" >> $env:GITHUB_ENV
          "FLUX_FFPROBE=$env:FLUX_FFPROBE" >> $env:GITHUB_ENV
      - name: Save compiled candidates before integration checks
        uses: actions/upload-artifact@v4
        with:
          name: candidate-windows-x64
          path: |
            release/Flux_${{ steps.plan.outputs.version }}_x64-setup.exe
            release/Flux-${{ steps.plan.outputs.version }}-windows-x64.zip
            release/Flux-${{ steps.plan.outputs.version }}-portableapps.zip
            release/Flux-${{ steps.plan.outputs.version }}-media-source.zip
            release/Flux-${{ steps.plan.outputs.version }}-chrome.zip
            release/Flux-${{ steps.plan.outputs.version }}-firefox.zip
            release/Flux-${{ steps.plan.outputs.version }}-firefox-120.zip
            release/Flux-${{ steps.plan.outputs.version }}-source.zip
            release/SHA256SUMS.txt
            release/candidate-provenance.json
          if-no-files-found: error
      - name: Core and desktop checks
        if: env.FLUX_CORE_TEST_RUN == ''
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo test --locked -p flux-core -p flux-cli -p flux-native-host *> .tools/core-tests.log
          Get-Content .tools/core-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
          cargo test --locked -p flux-desktop *>> .tools/core-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Desktop registration tests failed.' }
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
      - name: Download source-equivalent core validation
        if: env.FLUX_CORE_TEST_RUN != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FLUX_CORE_TEST_ARTIFACT }}
          path: .tools/validated-core
          run-id: ${{ env.FLUX_CORE_TEST_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain verified core test evidence
        if: env.FLUX_CORE_TEST_RUN != ''
        shell: pwsh
        run: |
          $log = Get-Content .tools/validated-core/core-tests.log -Raw
          if ($log -match 'test result: FAILED' -or $log -notmatch 'test result: ok\. 4 passed') { throw 'Candidate core test evidence is incomplete.' }
          Copy-Item -LiteralPath .tools/validated-core/core-tests.log -Destination .tools/core-tests.log -Force
          Write-Output "Retained successful Rust, desktop, formatting and Clippy checks from source-equivalent run $env:FLUX_CORE_TEST_RUN."
      - name: Save core validation evidence
        if: env.FLUX_CORE_TEST_RUN == ''
        uses: actions/upload-artifact@v4
        with:
          name: core-validation-windows-x64
          path: .tools/core-tests.log
          if-no-files-found: error
      - name: Browser and installed package checks
        shell: pwsh
        run: |
          ./scripts/prepare-firefox-tests.ps1
          $legacyGecko = ./scripts/prepare-gecko-isolation.ps1 -Version '120.0'
          $modernGecko = ./scripts/prepare-gecko-isolation.ps1 -Version '157.0.1'
          node ./scripts/test-firefox.mjs target/release $legacyGecko .tools/firefox/geckodriver.exe
          if ($LASTEXITCODE -ne 0) { throw 'Firefox 120 integration failed.' }
          node ./scripts/test-firefox.mjs target/release $modernGecko .tools/firefox/geckodriver.exe --modern
          if ($LASTEXITCODE -ne 0) { throw 'Modern Firefox integration failed.' }
          node ./scripts/test-firefox.mjs target/release $modernGecko .tools/firefox/geckodriver.exe --modern --store
          if ($LASTEXITCODE -ne 0) { throw 'Mozilla store identity integration failed.' }
          ./scripts/test-installer.ps1
          ./scripts/test-upgrade.ps1
          node ./scripts/test-daily-use.mjs target/release
          if ($LASTEXITCODE -ne 0) { throw 'Native daily-use tests failed.' }
          node ./scripts/test-torrent-window.mjs target/release
          if ($LASTEXITCODE -ne 0) { throw 'Native torrent window tests failed.' }
          node ./scripts/test-torrent-watch-window.mjs target/release
          if ($LASTEXITCODE -ne 0) { throw 'Torrent watch folder window tests failed.' }
          node ./scripts/test-chrome-hud.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Chromium HUD layout failed.' }
          node ./scripts/test-chrome-extension-ui.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Extension popup and settings interaction failed.' }
      - name: Record validation and verify package contents
        shell: pwsh
        run: |
          node ./scripts/record-hud-validation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'HUD validation record failed.' }
          node ./scripts/record-release-validation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release validation record failed.' }
          ./scripts/export-release.ps1
          ./scripts/verify-release.ps1
      - name: Upload immutable signing input
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.artifact }}
          path: |
            release/Flux_${{ steps.plan.outputs.version }}_x64-setup.exe
            release/Flux-${{ steps.plan.outputs.version }}-windows-x64.zip
            release/Flux-${{ steps.plan.outputs.version }}-portableapps.zip
            release/Flux-${{ steps.plan.outputs.version }}-media-source.zip
            release/Flux-${{ steps.plan.outputs.version }}-chrome.zip
            release/Flux-${{ steps.plan.outputs.version }}-firefox.zip
            release/Flux-${{ steps.plan.outputs.version }}-firefox-120.zip
            release/Flux-${{ steps.plan.outputs.version }}-source.zip
          if-no-files-found: error
      - name: Submit SignPath request
        if: env.SIGN_REQUESTED == 'true'
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Assemble verified release
        shell: pwsh
        run: ./scripts/finalize-public-release.ps1 -Signed:($env:SIGN_REQUESTED -eq 'true')
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: public-release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: validation-windows-x64
          path: docs/validation/release.json
          if-no-files-found: error
      - name: Preserve failed validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics-windows-x64
          path: |
            .tools/core-tests.log
            .tools/frontend-tests.log
          if-no-files-found: warn
  publish:
    if: inputs.publish || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version release/release-info.json)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; validated build artifacts remain available from this workflow. Existing published assets are preserved."
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --draft --generate-notes release/*
