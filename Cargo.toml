[workspace]
members = ["crates/core", "crates/cli", "crates/native-host", "src-tauri"]
default-members = ["crates/core", "crates/cli", "crates/native-host"]
resolver = "2"
exclude = ["vendor/reqwest", "vendor/librqbit"]

[patch.crates-io]
reqwest = { path = "vendor/reqwest" }
librqbit = { path = "vendor/librqbit" }

[workspace.package]
version = "2.7.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
flux-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
