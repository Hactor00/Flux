[package]
name = "flux-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
uuid.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "http2", "http3"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
url = "2"
fs2 = "0.4"
httpdate = "1"
scraper = "0.24"
globset = "0.4"
axum = "0.8"
xmltree = "0.11"
regex = "1"
dirs = "7"
time = { version = "0.3", features = ["parsing"] }
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
