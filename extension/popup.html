<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flux</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark">↯</div>
        <div>
          <strong>FLUX</strong>
          <p data-i18n="tagline"></p>
        </div>
        <button id="options" class="icon" data-i18n-title="settings">⚙</button>
      </header>
      <label class="hud-preference"
        ><input id="show-media-buttons" type="checkbox" role="switch" /><span
          data-i18n="showMediaButtons"
        ></span
      ></label>
      <div class="connection">
        <span id="dot"></span><span id="connection"></span
        ><button id="retry" data-i18n="retry"></button>
      </div>
      <section>
        <h2 data-i18n="downloadMedia"></h2>
        <div id="media" class="list"></div>
      </section>
      <section>
        <h2 data-i18n="new_download"></h2>
        <form id="add">
          <input
            id="url"
            type="url"
            required
            data-i18n-placeholder="source_url"
          /><button class="primary" data-i18n="start"></button>
        </form>
        <p id="message" role="status"></p>
      </section>
      <section id="collection-section" hidden>
        <h2 data-i18n="queueCollection"></h2>
        <p data-i18n="collectionHint"></p>
        <button
          id="download-collection"
          class="primary"
          data-i18n="queueCollection"
        ></button>
      </section>
      <section id="links-section" hidden>
        <h2 data-i18n="captureLinks"></h2>
        <input id="filter" data-i18n-placeholder="wildcard" />
        <div id="links" class="list"></div>
        <button id="download-links" data-i18n="downloadSelected"></button>
      </section>
      <section>
        <h2 data-i18n="transfer_queue"></h2>
        <div id="tasks" class="list"></div>
      </section>
      <footer data-i18n="privacy"></footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
