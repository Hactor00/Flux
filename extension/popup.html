<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flux</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <main>
      <header class="app-header">
        <img class="mark" src="icons/128.png" alt="" width="36" height="36" />
        <div class="brand">
          <strong>Flux</strong
          ><span id="extension-version" class="version"></span>
        </div>
        <span id="current-site" class="current-site"></span>
        <button id="options" class="icon" data-i18n-title="settings">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>
      <section class="connection-card" aria-live="polite">
        <div class="connection">
          <span id="dot"></span>
          <div class="connection-copy">
            <strong id="connection"></strong
            ><span id="desktop-version" class="caption"></span>
          </div>
          <button id="retry" class="quiet" data-i18n="retry"></button>
        </div>
        <label class="hud-preference"
          ><span data-i18n="showMediaButtons"></span
          ><input id="show-media-buttons" type="checkbox" role="switch"
        /></label>
      </section>
      <section
        id="update-notice"
        class="notice update-notice"
        role="status"
        hidden
      >
        <strong id="update-title"></strong>
        <p id="update-help"></p>
        <a
          href="https://github.com/Hactor00/Flux/releases/latest"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="releaseDownloads"
        ></a>
      </section>
      <section id="desktop-install-help" class="notice" role="status" hidden>
        <p data-i18n="desktopRequired"></p>
        <a
          class="download-link"
          href="https://fluxdownload.org/download/"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="releaseDownloads"
        ></a>
      </section>
      <section class="quick-add">
        <h2 data-i18n="new_download"></h2>
        <form id="add">
          <input
            id="url"
            type="url"
            required
            data-i18n-placeholder="source_url"
            data-i18n-title="source_url"
          /><button class="primary" data-i18n="start"></button>
        </form>
      </section>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <div class="tabs" role="tablist" data-i18n-title="downloads">
        <button
          id="tab-media"
          role="tab"
          aria-controls="media-section"
          aria-selected="true"
          tabindex="0"
        >
          <span data-i18n="downloadMedia"></span
          ><span id="media-count" class="count">0</span></button
        ><button
          id="tab-links"
          role="tab"
          aria-controls="links-section"
          aria-selected="false"
          tabindex="-1"
        >
          <span data-i18n="captureLinks"></span
          ><span id="links-count" class="count">0</span></button
        ><button
          id="tab-queue"
          role="tab"
          aria-controls="queue-section"
          aria-selected="false"
          tabindex="-1"
        >
          <span data-i18n="transfer_queue"></span
          ><span id="tasks-count" class="count">0</span>
        </button>
      </div>
      <section
        id="media-section"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-media"
      >
        <div id="media" class="list"></div>
        <section id="collection-section" class="collection-card" hidden>
          <h2 data-i18n="queueCollection"></h2>
          <p data-i18n="collectionHint"></p>
          <button
            id="download-collection"
            class="secondary"
            data-i18n="queueCollection"
          ></button>
        </section>
      </section>
      <section
        id="links-section"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-links"
        hidden
      >
        <input
          id="filter"
          data-i18n-placeholder="wildcard"
          data-i18n-title="wildcard"
        />
        <div id="links" class="list"></div>
        <button
          id="download-links"
          class="primary full-width"
          data-i18n="downloadSelected"
          disabled
        ></button>
      </section>
      <section
        id="queue-section"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-queue"
        hidden
      >
        <div id="tasks" class="list"></div>
      </section>
      <footer>
        <span class="privacy-dot" aria-hidden="true"></span
        ><span data-i18n="privacy"></span
        ><a
          href="https://fluxdownload.org/"
          target="_blank"
          rel="noopener noreferrer"
          >fluxdownload.org</a
        >
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
